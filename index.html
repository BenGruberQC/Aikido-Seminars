<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Séminaires d'Aïkido</title>

  <!-- Feuille de style Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Feuilles de style Leaflet MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 10px 20px;
      background-color: #1a1a1a;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #map {
      flex: 1;
      width: 100%;
    }
    /* Style personnalisé des pastilles de regroupement */
    .my-cluster {
      background-color: rgba(220, 53, 69, 0.9);
      border: 2px solid #ffffff;
      border-radius: 50%;
      color: #ffffff;
      font-weight: bold;
      text-align: center;
      line-height: 30px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <header>
    <h1>Séminaires d'Aïkido</h1>
    <div>Par <strong>BenGruberQC</strong></div>
  </header>

  <div id="map"></div>

  <!-- Scripts Leaflet & MarkerCluster -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    // 1. Initialisation de la carte
    const map = L.map('map').setView([45.5017, -73.5673], 4);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 2. Initialisation du groupe de grappes (Cluster)
    // maxClusterRadius: distance de regroupement en pixels (faible pour ne fusionner que les stages proches ou identiques)
    const markersGroup = L.markerClusterGroup({
      showCoverageOnHover: false,
      maxClusterRadius: 20, 
      iconCreateFunction: function(cluster) {
        const count = cluster.getChildCount();
        return L.divIcon({
          html: `<div><span>${count}</span></div>`,
          className: 'my-cluster leaflet-marker-icon',
          iconSize: L.point(32, 32)
        });
      }
    });

    // 3. Exemple de chargement des données (ou lecture de votre fichier TSV/JSON)
    function chargerSeminaires(data) {
      markersGroup.clearLayers();

      data.forEach(item => {
        if (item.latitude && item.longitude) {
          const lat = parseFloat(item.latitude);
          const lng = parseFloat(item.longitude);

          if (!isNaN(lat) && !isNaN(lng)) {
            const marker = L.marker([lat, lng]);

            const popupContent = `
              <div style="font-size: 13px;">
                <strong style="font-size: 14px;">${item.titre}</strong><br>
                <b>Intervenant(s) :</b> ${item.sensei || 'Non spécifié'}<br>
                <b>Dates :</b> ${item.dateDebut} au ${item.dateFin}<br>
                <b>Lieu :</b> ${item.dojoHote || ''}, ${item.ville || ''}<br>
                ${item.web ? `<a href="${item.web}" target="_blank">Lien événement</a>` : ''}
              </div>
            `;

            marker.bindPopup(popupContent);
            markersGroup.addLayer(marker);
          }
        }
      });

      map.addLayer(markersGroup);
    }

    // Exemple de données de test correspondant à votre registre :
    const demoData = [
      {
        titre: "March Break Seminar",
        sensei: "George Hewson, Alex Loo, David Yates, John Foster",
        dateDebut: "2027-03-13",
        dateFin: "2027-03-13",
        dojoHote: "Toronto Beaches Aikikai",
        ville: "Toronto",
        latitude: 43.6532,
        longitude: -79.3832
      },
      {
        titre: "Aikido & Iaido Seminar",
        sensei: "Dale Nordenberg, Fiona Blyth",
        dateDebut: "2026-10-30",
        dateFin: "2026-11-01",
        dojoHote: "Toronto Aikikai",
        ville: "Toronto",
        latitude: 43.6543,
        longitude: -79.4526
      },
      {
        titre: "Autre séminaire au même dojo",
        sensei: "Sensei Exemple",
        dateDebut: "2027-05-10",
        dateFin: "2027-05-12",
        dojoHote: "Toronto Beaches Aikikai",
        ville: "Toronto",
        latitude: 43.6532,
        longitude: -79.3832
      }
    ];

    chargerSeminaires(demoData);
  </script>
</body>
</html>
