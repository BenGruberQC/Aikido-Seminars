<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte et Calendrier des Stages d'Aïkido</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- FullCalendar CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" />

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
    }

    #map {
      height: 500px;
      width: 100%;
      margin-bottom: 30px;
      border-radius: 6px;
    }

    #calendar {
      max-width: 1100px;
      margin: 0 auto;
    }

    .custom-pin svg {
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <div id="calendar"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- FullCalendar JS -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

  <!-- PapaParse pour lire le CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    // Remplacez cette URL par votre lien d'export CSV Google Sheets
    const GOOGLE_SHEET_CSV_URL = "VOTRE_LIEN_GOOGLE_SHEET_CSV_ICI";

    // 1. Calcul de la couleur selon l'échéance par rapport à aujourd'hui
    function getStageColor(startDateStr) {
      if (!startDateStr) return "#757575"; // Gris par défaut si pas de date

      const now = new Date();
      const target = new Date(startDateStr);

      if (isNaN(target.getTime())) return "#757575";

      // Écart en mois
      const monthDiff = (target.getFullYear() - now.getFullYear()) * 12 + (target.getMonth() - now.getMonth());

      // Mois en cours
      if (monthDiff === 0 && target >= new Date(now.getFullYear(), now.getMonth(), 1)) {
        return "#e53935"; // Rouge
      }
      // Stage passé
      if (monthDiff < 0) {
        return "#757575"; // Gris
      }
      // Dans 1 à 3 mois
      if (monthDiff >= 1 && monthDiff <= 3) {
        return "#fb8c00"; // Orange
      }
      // Dans 4 à 6 mois
      if (monthDiff >= 4 && monthDiff <= 6) {
        return "#fbc02d"; // Jaune
      }
      // Au-delà (7 mois et plus)
      return "#43a047";   // Vert
    }

    // 2. Génération d'une icône Leaflet SVG colorée
    function getMarkerIcon(color) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="26" height="38">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 9 12 24 12 24s12-15 12-24c0-6.63-5.37-12-12-12z" fill="${color}" stroke="#ffffff" stroke-width="1.5"/>
          <circle cx="12" cy="12" r="4.5" fill="#ffffff"/>
        </svg>`;

      return L.divIcon({
        className: 'custom-pin',
        html: svg,
        iconSize: [26, 38],
        iconAnchor: [13, 38],
        popupAnchor: [0, -34]
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      // Initialisation de la carte
      const map = L.map("map").setView([46.603354, 1.888334], 5);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      // Initialisation du calendrier
      const calendarEl = document.getElementById("calendar");
      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: "dayGridMonth",
        locale: "fr",
        headerToolbar: {
          left: "prev,next today",
          center: "title",
          right: "dayGridMonth,timeGridWeek,listMonth"
        },
        events: []
      });
      calendar.render();

      // Récupération et parsing du CSV
      Papa.parse(GOOGLE_SHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function (results) {
          const events = [];
          const validBounds = [];

          results.data.forEach(function (row) {
            const id = row["ID Événement"] || row["ID"] || "";
            const title = row["Titre du séminaire"] || row["Titre"] || "Stage Aïkido";
            const sensei = row["Intervenant (Sensei)"] || row["Sensei"] || "";
            const grade = row["Titre / Grade"] || row["Grade"] || "";
            const hostDojo = row["Dojo Hôte"] || "";
            const city = row["Ville"] || "";
            const startDate = row["Date Début"] || "";
            const endDate = row["Date Fin"] || startDate;
            const address = row["Adresse Civique"] || "";
            const pricing = row["Tarif Complet"] || "";

            if (!startDate) return;

            // Détermination de la couleur selon la date
            const color = getStageColor(startDate);

            // Validation stricte des coordonnées GPS
            const rawLat = (row["Latitude"] || "").toString().trim().replace(",", ".");
            const rawLng = (row["Longitude"] || "").toString().trim().replace(",", ".");
            const lat = parseFloat(rawLat);
            const lng = parseFloat(rawLng);

            const hasValidCoords = !isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;

            if (hasValidCoords) {
              const marker = L.marker([lat, lng], {
                icon: getMarkerIcon(color)
              }).addTo(map);

              marker.bindPopup(`
                <strong>${title}</strong><br>
                ${sensei ? `Sensei : ${sensei}${grade ? `(${grade})` : ""}<br>` : ""}
                ${hostDojo ? `Dojo : ${hostDojo}<br>` : ""}
                ${city ? `Ville : ${city}<br>` : ""}
                Dates : du ${startDate} au ${endDate}<br>
                ${pricing ? `Tarif : ${pricing}<br>` : ""}
                ${address ? `<small>${address}</small>` : ""}
              `);

              validBounds.push([lat, lng]);
            }

            // Calcul de la date de fin inclusive pour FullCalendar
            let adjustedEnd = endDate;
            if (endDate) {
              const d = new Date(endDate);
              d.setDate(d.getDate() + 1);
              adjustedEnd = d.toISOString().split("T")[0];
            }

            // Ajout au tableau d'événements avec gestion du contraste du texte
            events.push({
              id: id,
              title: `${sensei ? sensei + " - " : ""}${title}`,
              start: startDate,
              end: adjustedEnd,
              backgroundColor: color,
              borderColor: color,
              textColor: (color === "#fbc02d") ? "#000000" : "#ffffff"
            });
          });

          // Mise à jour du calendrier
          calendar.removeAllEvents();
          events.forEach(e => calendar.addEvent(e));

          // Ajustement de la vue carte si des points sont trouvés
          if (validBounds.length > 0) {
            map.fitBounds(validBounds, { padding: [30, 30] });
          }
        },
        error: function (err) {
          console.error("Erreur lors de la lecture du CSV :", err);
        }
      });
    });
  </script>
</body>
</html>
